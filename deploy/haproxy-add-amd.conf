# =============================================================================
# HAProxy change #2 (LATER): add the AMD R9700 backend through its logger
# =============================================================================
#
# Only do this once the AMD Ollama server exists and the second logger is up:
#       AMD_OLLAMA_BACKEND_URL=http://<amd-ip>:11434 \
#       AMD_BACKEND_NAME=amd-r9700 \
#       docker compose --profile amd up -d
#
# The AMD logger listens on 11436 and is named `logger-amd`
# (container `ollama-token-logger-amd`).
#
# Ensure both loggers share the network with HAProxy:
#       docker network connect ollama-token-logger_net ollama-haproxy
#
# THEN, in the same :4001 backend, add a second server so HAProxy keeps its
# existing `leastconn` balancing across BOTH backends:
#
#   BEFORE (RTX only):
#       server rtx5090-logger logger-5090:11435 check
#   AFTER  (RTX + AMD):
#       server rtx5090-logger logger-5090:11435 check
#       server amd-r9700-logger logger-amd:11436 check
#
# Every request through HAProxy is still logged by whichever logger serves it,
# tagged with that backend's identity (rtx5090 vs amd-r9700) in usage.jsonl.
#
# To report per-backend or across both, use the reporter:
#       docker compose exec logger-5090 python report.py --period 30d
#       docker compose exec -it logger-amd python report.py --period 30d
# =============================================================================
