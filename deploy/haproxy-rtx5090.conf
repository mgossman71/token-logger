# =============================================================================
# HAProxy change #1: route the RTX 5090 backend through the Token Logger
# =============================================================================
#
# WHERE: your existing HAProxy file that defines the :4001 frontend/backend
#        (the file mounted into the `ollama-haproxy` container).
#
# DO THIS FIRST (never overwrite blindly):
#   1. Find the config on the host:
#        docker inspect ollama-haproxy \
#          --format '{{range .Mounts}}{{.Source}}{{"\n"}}{{end}}'
#   2. Back it up:
#        cp <that-file> <that-file>.bak-$(date +%Y%m%d-%H%M%S)
#   3. Edit with vim:
#        vi <that-file>
#   4. Reload (no restart needed):
#        docker exec -it ollama-haproxy haproxy -c -f <that-file>   # validate
#        docker restart ollama-haproxy
#
# ---------------------------------------------------------------------------
# OPTION A (PREFERRED) - Docker service-name routing, no IP assumptions.
#
#   Requires the logger and HAProxy to share one Docker network. Do this once:
#       docker network connect ollama-token-logger_net ollama-haproxy
#   After that, Docker's embedded DNS resolves `logger-5090` (compose alias)
#   and `ollama-token-logger-5090` (container name).
#
#   BEFORE:
#       server rtx5090 10.0.0.140:11434 check
#   AFTER:
#       server rtx5090-logger logger-5090:11435 check
#
#   Keep the existing `balance leastconn`, the `option httpchk` /
#   `check send "GET /api/version ..."` lines, and any `timeout` lines as-is.
#   The logger forwards GET /api/version to Ollama, so the health check still
#   works and now also validates the logger->Ollama path.
#
# ---------------------------------------------------------------------------
# OPTION B (FALLBACK) - published host address, no shared network.
#
#   If you do NOT want to attach HAProxy to the logger's network, point it at
#   the logger's published port on the docker0 host instead. Get the host IP:
#       hostname -I          # e.g. 10.0.0.60
#   BEFORE:
#       server rtx5090 10.0.0.140:11434 check
#   AFTER:
#       server rtx5090-logger 10.0.0.60:11435 check
# =============================================================================
